<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Man'al Box — Lebanese BBQ</title>
<meta name="description" content="Man'al Box — ready-to-grill Lebanese BBQ boxes. Order on WhatsApp." />

<!-- WhatsApp / social preview card -->
<meta property="og:title" content="Man'al Box — Lebanese BBQ" />
<meta property="og:description" content="Ready-to-grill Lebanese BBQ boxes. Tap to order on WhatsApp." />
<meta property="og:type" content="website" />
<!-- once deployed, make this an absolute URL, e.g. https://YOURSITE.vercel.app/preview.jpg -->
<meta property="og:image" content="preview.jpg" />
<meta name="theme-color" content="#c81e1e" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     The only parts you need to edit are marked in the <script>:
       1) WHATSAPP_NUMBER
       2) BOXES / DRINKS arrays (names / prices / descriptions / img)
       3) ABOUT text
     Animations are layered on top of the approved design below —
     they do not change any colors, fonts, spacing or layout.
     ========================================================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:#fafafa;background:#0d0d0d;min-height:100vh;
  }
  body[dir="rtl"]{font-family:'Cairo',sans-serif}
  a,button{transition:transform .12s ease, filter .12s ease}
  a:active,button:active{transform:scale(.97)}
  img{display:block;max-width:100%}

  .page{display:flex;flex-direction:column;min-height:100vh;transition:opacity .18s ease}
  .page.lang-fade{opacity:0}
  .wrap{max-width:1200px;margin:0 auto;width:100%;padding-inline:clamp(16px,4vw,64px)}

  /* header */
  .hero{background:linear-gradient(160deg,#c81e1e,#7a0f0f);
    padding-top:clamp(30px,5vw,60px);padding-bottom:clamp(26px,4vw,44px);
    position:relative;overflow:hidden}
  /* subtle slow-drifting red glow behind the header */
  .hero::after{content:"";position:absolute;top:-40%;left:-12%;width:55%;height:180%;
    background:radial-gradient(circle at center, rgba(255,96,74,.55), rgba(255,96,74,0) 62%);
    filter:blur(18px);pointer-events:none;z-index:0;
    animation:drift 15s ease-in-out infinite}
  .hero .wrap{position:relative;z-index:1}
  .hero-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .brand{font-weight:800;font-size:clamp(30px,5vw,54px);letter-spacing:-.5px}
  .tagline{font-size:clamp(13px,1.5vw,17px);opacity:.9;margin-top:6px}
  .langbtn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:20px;
    padding:8px 18px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;
    font-family:inherit;backdrop-filter:blur(4px)}

  /* menu */
  main{padding-block:clamp(18px,3vw,36px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(14px,2.5vw,28px)}
  .card{background:#181818;border:1px solid #262626;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
    opacity:0;transform:translateY(18px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
    transition-delay:calc(var(--i,0) * 70ms)}
  .card.in{opacity:1;transform:none}
  .card.in:hover{transform:translateY(-6px);box-shadow:0 14px 32px rgba(0,0,0,.45)}
  .imgbox{aspect-ratio:4/3;background:#1a1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .imgbox img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease, transform .6s ease}
  .imgbox img.loaded{opacity:1}
  .card.in:hover .imgbox img{transform:scale(1.05)}
  .imgbox svg{width:42%;height:42%;stroke:rgba(255,255,255,.35)}
  /* image loading shimmer until each photo loads */
  .imgbox.loading::before{content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(100deg,#181818 25%,#242424 45%,#181818 65%);
    background-size:200% 100%;animation:shimmer 1.3s linear infinite}
  .cbody{padding:16px 18px;display:flex;flex-direction:column;flex:1}
  .name{font-size:19px;font-weight:700}
  .desc{font-size:14px;color:#bdbdbd;margin:6px 0 14px;line-height:1.5;flex:1}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .price{font-size:15px;color:#ff6b6b;font-weight:600}

  .stepper{display:flex;align-items:center;gap:10px}
  .qbtn{width:36px;height:36px;border-radius:18px;border:none;background:#e23b3b;color:#fff;
    font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
  .qbtn.minus{background:rgba(255,255,255,.14)}
  .qbtn[disabled]{opacity:.35;cursor:not-allowed}
  .addbtn{width:auto;padding:0 18px}
  .qbtn.pop{animation:pop .28s ease}
  .qty{min-width:20px;text-align:center;font-weight:700;font-size:18px}
  .qty.bump{animation:qroll .3s ease}

  /* footer */
  footer{background:#0a0a0a;border-top:1px solid rgba(255,255,255,.1);margin-top:auto}
  .fgrid{display:grid;gap:clamp(20px,3vw,40px);grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    padding-block:clamp(32px,5vw,56px)}
  .fgrid h3{font-size:22px;margin-bottom:12px;font-weight:800}
  .fgrid p{font-size:15px;line-height:1.6;color:rgba(250,250,250,.65);max-width:460px}
  .finfo{display:grid;gap:14px;align-content:start}
  .flabel{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(250,250,250,.55)}
  body[dir="rtl"] .flabel{text-transform:none}
  .fval{font-size:16px;font-weight:600}
  .fsocials{display:flex;gap:12px}
  .fsocials a{color:#fafafa;text-decoration:none;font-weight:600;font-size:15px;border-bottom:2px solid rgba(255,255,255,.18)}
  .copyright{border-top:1px solid rgba(255,255,255,.08);padding:16px 24px;text-align:center;
    font-size:13px;color:rgba(250,250,250,.55)}

  /* order bar */
  .orderbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#181818;
    border-top:1px solid rgba(255,255,255,.12);box-shadow:0 -6px 24px rgba(0,0,0,.4);display:block;
    transform:translateY(130%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
  .orderbar.show{transform:translateY(0)}
  .orderbar .inner{max-width:1200px;margin:0 auto;padding:12px clamp(16px,4vw,64px);
    display:flex;align-items:center;gap:16px}
  .count{color:#fff;font-size:15px;white-space:nowrap}
  .count b{font-size:20px;display:inline-block}
  .count b.bump{animation:qroll .3s ease}
  .orderlink{flex:1;max-width:420px;margin-inline-start:auto;text-align:center;background:#25D366;
    color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:13px 0;border-radius:12px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    animation:waPulse 2.4s ease-in-out infinite}
  body.cart-open{padding-bottom:80px}

  /* ---------- new UI: sections, choose button, drinks (reuses existing tokens) ---------- */
  .sec-title{font-size:clamp(20px,3vw,26px);font-weight:800;margin:clamp(22px,4vw,40px) 0 2px}
  .cartbtn{background:none;border:none;color:#fff;font:inherit;cursor:pointer;display:flex;
    align-items:center;gap:7px;padding:0;white-space:nowrap}
  .cartbtn .caret{font-size:12px;opacity:.7}
  .choosebtn{width:100%;justify-content:center}
  .card.drink .cbody{padding:16px 18px}
  .stepper.sm .qbtn{width:30px;height:30px;font-size:18px}

  /* ---------- modal (configure + cart) ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.62);backdrop-filter:blur(2px)}
  .modal.show{display:flex}
  #configModal{z-index:70}   /* sits above the cart when editing a line */
  @media(min-width:640px){.modal{align-items:center;padding:24px}}
  .sheet{background:#181818;border:1px solid #262626;width:100%;max-width:520px;max-height:92vh;
    border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
    animation:sheetIn .28s cubic-bezier(.22,1,.36,1)}
  @media(min-width:640px){.sheet{border-radius:20px}}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:18px 20px;border-bottom:1px solid #262626}
  .sheet-title{font-size:20px;font-weight:800}
  .sheet-price{font-size:14px;color:#ff6b6b;font-weight:600;margin-top:2px}
  .sheet .x{background:rgba(255,255,255,.1);border:none;color:#fafafa;width:34px;height:34px;
    border-radius:17px;font-size:22px;line-height:1;cursor:pointer;flex:none;font-family:inherit}
  .sheet-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
  .field-label{font-size:14px;font-weight:700;color:#e6e6e6;margin-bottom:10px;display:flex;
    align-items:center;gap:8px;flex-wrap:wrap}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{background:#111;border:1px solid #333;color:#eaeaea;border-radius:12px;padding:10px 18px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .opt.is-selected{background:#e23b3b;border-color:#e23b3b;color:#fff}
  .counter{font-size:12px;font-weight:700;background:rgba(255,255,255,.1);color:#bdbdbd;
    padding:3px 9px;border-radius:10px}
  .counter.ok{background:rgba(37,211,102,.16);color:#25D366}
  .field-toggle{width:100%;min-height:44px;background:none;border:none;padding:0;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:#e6e6e6;text-align:start;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field-toggle.is-open{margin-bottom:10px}
  .field-toggle .ft-txt{flex:1}
  .chev{flex:none;font-size:12px;color:#bdbdbd;transition:transform .2s;transform:rotate(-90deg)}
  .field-toggle.is-open .chev{transform:rotate(0deg)}
  .cfg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
  .cfg-row:first-of-type{border-top:none}
  .cfg-name{font-size:15px}
  .sheet-foot{padding:14px 20px;border-top:1px solid #262626;display:flex;flex-direction:column;gap:10px}
  .hint{font-size:13px;color:#ff9b9b}
  .foot-btns{display:flex;gap:10px}
  .btn-ghost{flex:none;background:rgba(255,255,255,.12);border:none;color:#fafafa;border-radius:12px;
    padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
  .btn-primary{flex:1;background:#25D366;border:none;color:#fff;border-radius:12px;padding:13px 18px;
    font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;text-align:center;
    text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary[disabled]{opacity:.4;cursor:not-allowed}
  .citem{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
  .citem:first-child{border-top:none}
  .citem-txt{font-size:14px;line-height:1.5;color:#eaeaea}
  .rm{background:rgba(255,255,255,.1);border:none;color:#ff8080;width:30px;height:30px;flex:none;
    border-radius:15px;font-size:18px;cursor:pointer;font-family:inherit}
  .citem-acts{display:flex;align-items:center;gap:8px;flex:none}
  .edit{background:rgba(255,255,255,.1);border:none;color:#eaeaea;height:30px;padding:0 13px;
    border-radius:15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .empty{color:#bdbdbd;font-size:15px;text-align:center;padding:24px 0}
  body.modal-open{overflow:hidden}

  /* ---------- keyframes (layered on, no design change) ---------- */
  @keyframes drift{
    0%{transform:translate(-8%,-8%)}
    50%{transform:translate(10%,6%)}
    100%{transform:translate(-8%,-8%)}
  }
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }
  @keyframes pop{
    0%{transform:scale(1)}
    40%{transform:scale(1.32)}
    100%{transform:scale(1)}
  }
  @keyframes qroll{
    0%{transform:translateY(-.55em);opacity:0}
    100%{transform:translateY(0);opacity:1}
  }
  @keyframes waPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.45)}
    50%{box-shadow:0 0 0 12px rgba(37,211,102,0)}
  }
  @keyframes sheetIn{
    from{transform:translateY(24px);opacity:0}
    to{transform:none;opacity:1}
  }

  /* ---------- respect reduced-motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
    .page{transition:none}
    .card{opacity:1;transform:none;transition:none}
    .card.in:hover{transform:none;box-shadow:none}
    .card.in:hover .imgbox img{transform:none}
    .imgbox img{opacity:1;transition:none}
    .orderbar{transition:none}
    .hero::after{display:none}
    .sheet{animation:none}
    .modal{backdrop-filter:none}
  }
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="wrap hero-inner">
      <div>
        <div class="brand" id="brand">Man'al Box</div>
        <div class="tagline" id="tagline"></div>
      </div>
      <button class="langbtn" id="langbtn" onclick="toggleLang()"></button>
    </div>
  </div>

  <main class="wrap">
    <div class="grid" id="menu"></div>
    <h2 class="sec-title" id="drinksTitle"></h2>
    <div class="grid" id="drinks"></div>
  </main>

  <footer>
    <div class="wrap fgrid">
      <div>
        <h3 id="aboutTitle"></h3>
        <p id="aboutBody"></p>
      </div>
      <div class="finfo">
        <div><div class="flabel" id="hoursLabel"></div><div class="fval" id="hoursVal"></div></div>
        <div><div class="flabel" id="locLabel"></div><div class="fval" id="locVal"></div></div>
        <div>
          <div class="fsocials">
            <a id="igLink" target="_blank" rel="noreferrer">Instagram</a>
            <a id="waLink" target="_blank" rel="noreferrer">WhatsApp</a>
          </div>
        </div>
      </div>
    </div>
    <div class="copyright" id="copyright"></div>
  </footer>
</div>

<div class="orderbar" id="orderbar">
  <div class="inner">
    <button class="count cartbtn" onclick="openCart()"><b id="cartCount">0</b> <span id="cartWord"></span> <span class="caret">▾</span></button>
    <a class="orderlink" id="orderLink" target="_blank" rel="noreferrer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-1.5-.8-2.5-1.4-3.5-3.1-.3-.5.3-.4.8-1.4.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5 4.5 1.9.8 2.6.9 3.5.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 00-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1012 2z"/></svg>
      <span id="orderText"></span>
    </a>
  </div>
</div>

<!-- configure a box (per-unit choices) -->
<div class="modal" id="configModal" onclick="if(event.target===this)closeConfig()">
  <div class="sheet" id="configSheet"></div>
</div>
<!-- cart / review -->
<div class="modal" id="cartModal" onclick="if(event.target===this)closeCart()">
  <div class="sheet" id="cartSheet"></div>
</div>

<script>
/* =========================================================
   1) SET THE RESTAURANT WHATSAPP NUMBER HERE
      International format, digits only — no +, no spaces.
      Lebanon example: "9613123456"
   ========================================================= */
const WHATSAPP_NUMBER = "96171308437";
const INSTAGRAM = "https://www.instagram.com/man2albox.lb";

/* =========================================================
   2) MENU DATA — boxes, drinks, and the shared option lists.
      Every box includes the standard kit; only the skewer
      type changes. Prices are in Lebanese pounds (L.L).
   ========================================================= */
const BOXES = [
  { id:"beef",    en:"Beef Box",    ar:"بوكس لحمة",  price:1700000, img:"box.png",
    dEn:"6 beef skewers with your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ لحمة مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"kafta",   en:"Kafta Box",   ar:"بوكس كفتة",  price:1400000, img:"box.png",
    dEn:"6 kafta skewers with your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ كفتة مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"makanek", en:"Makanek Box", ar:"بوكس مقانق", price:1400000, img:"box.png",
    dEn:"6 makanek skewers with your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ مقانق مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"sejouk",  en:"Sejouk Box",  ar:"بوكس سجق",   price:1400000, img:"box.png",
    dEn:"6 sejouk skewers with your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ سجق مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"tawouk",  en:"Tawouk Box",  ar:"بوكس طاووق", price:1250000, img:"box.png",
    dEn:"6 tawouk skewers with your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ طاووق مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"mix",     en:"Mix Box",     ar:"بوكس مكس",   price:1500000, img:"box.png",
    dEn:"6 skewers: beef, kafta, tawouk. With your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ: لحمة، كفتة، طاووق. مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"mixpro",  en:"Mix Pro Box", ar:"بوكس مكس برو", price:1700000, img:"box.png",
    dEn:"6 skewers: beef, kafta, tawouk, sejouk, makanek. With your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"6 أسياخ: لحمة، كفتة، طاووق، سجق، مقانق. مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
  { id:"custom",  en:"Customized Box", ar:"بوكس مخصّص", price:1700000, img:"box.png", custom:true,
    dEn:"Choose your 6 skewers. With your choice of tabbouleh or fattoush, pickles, garlic, hummus, and bread. Includes grill, charcoal, charcoal cooler, gloves, and grabber.",
    dAr:"اختر 6 أسياخ. مع تبولة أو فتوش، كبيس، ثوم، حمص، وخبز. يشمل الشواية، الفحم، مبرّد الفحم، الكفوف، والملقط." },
];

// meat types — used for the Customized box and for extra shish add-ons
const SHISH = [
  { id:"beef",    en:"Beef",    ar:"لحمة" },
  { id:"kafta",   en:"Kafta",   ar:"كفتة" },
  { id:"makanek", en:"Makanek", ar:"مقانق" },
  { id:"sejouk",  en:"Sejouk",  ar:"سجق" },
  { id:"tawouk",  en:"Tawouk",  ar:"طاووق" },
];

const SALADS = [
  { id:"tabbouleh", en:"Tabbouleh", ar:"تبولة" },
  { id:"fattoush",  en:"Fattoush",  ar:"فتوش" },
];

const DRINKS = [
  { id:"sevenup",     en:"Seven Up",             ar:"سفن أب",     price:100000 },
  { id:"sevenupzero", en:"Seven Up Zero Sugar",  ar:"سفن أب زيرو", price:100000 },
  { id:"pepsi",       en:"Pepsi",                ar:"بيبسي",      price:100000 },
  { id:"pepsidiet",   en:"Pepsi Diet",           ar:"بيبسي دايت", price:100000 },
  { id:"pepsizero",   en:"Pepsi Zero Sugar",     ar:"بيبسي زيرو", price:100000 },
  { id:"mirinda",     en:"Mirinda",              ar:"ميرندا",     price:100000 },
];

const EXTRA_PRICE = 150000;   // per extra shish

/* =========================================================
   3) ABOUT / FOOTER text
   ========================================================= */
const ABOUT = {
  en:{ title:"About Man'al Box",
    body:"Man'al Box introduces a fresh new concept in Lebanese BBQ — your complete grilling experience, packed and ready to go wherever you are. Whether you're heading to the beach, planning a picnic, gathering with friends, or enjoying a spontaneous BBQ night, Man'al Box brings everything together in one convenient package. Just open the box, light the charcoal, grill your favorites, and enjoy the moment. It's more than a meal — it's the full Lebanese BBQ experience, made portable, practical, and ready whenever you are.",
    hoursLabel:"Hours", hours:"Daily · 11:00 – 23:00",
    locLabel:"Location", loc:"Beirut", followLabel:"Follow us" },
  ar:{ title:"عن منقل بوكس",
    body:"منقل بوكس يقدّم مفهومًا جديدًا للمشاوي اللبنانية — تجربة شوي متكاملة، مجهّزة وجاهزة أينما كنت. سواء كنت ذاهبًا إلى البحر، تخطّط لنزهة، تجتمع مع الأصدقاء، أو تستمتع بليلة شواء عفوية، منقل بوكس يجمع كل شيء في عبوة واحدة. فقط افتح الصندوق، أشعل الفحم، اشوِ ما تحب، واستمتع باللحظة. إنها أكثر من مجرد وجبة — إنها تجربة المشاوي اللبنانية الكاملة، محمولة وعملية وجاهزة متى ما أردت.",
    hoursLabel:"أوقات العمل", hours:"يوميًا · ١١:٠٠ – ٢٣:٠٠",
    locLabel:"الموقع", loc:"بيروت", followLabel:"تابعونا" },
};

const T = {
  en:{ tagline:"Lebanese BBQ · grill-at-home boxes", order:"Order on WhatsApp",
    each:"L.L", items:"items", langBtn:"عربي", copyright:"All rights reserved",
    drinksTitle:"Drinks", choose:"Choose",
    saladField:"Choose your salad", extraField:"Addons (+150,000 L.L each)",
    customField:"Build your 6 skewers", ofSix:"of 6",
    addToCart:"Add to cart", saveChanges:"Save changes", cancel:"Cancel",
    cartTitle:"Your order", addMore:"Add more",
    emptyCart:"Your cart is empty", remove:"Remove", edit:"Edit",
    pickSalad:"Please choose a salad", pickSix:"Choose exactly 6 skewers",
    msgHeader:"New order — Man'al Box", saladLbl:"Salad", extraLbl:"Addons",
    skewersLbl:"Skewers", totalLbl:"Total", noDelivery:"Price does not include delivery",
    thanks:"Thanks! We'll contact you to confirm your order 🔥", listSep:", " },
  ar:{ tagline:"مشاوي لبنانية · بوكسات شوي بالبيت", order:"اطلب عبر واتساب",
    each:"ل.ل", items:"عناصر", langBtn:"EN", copyright:"جميع الحقوق محفوظة",
    drinksTitle:"مشروبات", choose:"اختر",
    saladField:"اختر السلطة", extraField:"إضافات (+150,000 ل.ل للسيخ)",
    customField:"اختر 6 أسياخ", ofSix:"من 6",
    addToCart:"أضف إلى السلة", saveChanges:"حفظ التعديلات", cancel:"إلغاء",
    cartTitle:"طلبك", addMore:"أضف المزيد",
    emptyCart:"السلة فارغة", remove:"حذف", edit:"تعديل",
    pickSalad:"يرجى اختيار السلطة", pickSix:"اختر 6 أسياخ بالضبط",
    msgHeader:"طلب جديد — منقل بوكس", saladLbl:"سلطة", extraLbl:"إضافات",
    skewersLbl:"أسياخ", totalLbl:"المجموع", noDelivery:"السعر لا يشمل التوصيل",
    thanks:"شكراً! رح نتواصل معك لتأكيد الطلب 🔥", listSep:"، " },
};

// ---- state ----
let lang = (navigator.language || "en").startsWith("ar") ? "ar" : "en";
let boxLines = [];        // configured box line items: {uid,id,salad,extras[],skewers[]|null}
let drinks = {};          // drinkId -> qty
let uidSeq = 1;
let draft = null;         // in-progress config: {id, salad, extras:{}, skewers:{}}
const fmt = n => n.toLocaleString("en-US").replace(/,/g,".");
const PLACEHOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M6 3v6a3 3 0 006 0V3M9 3v18M15 3c-1 3-1 6 0 8v10" stroke-linecap="round"/></svg>';
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- lookups ----
const boxById   = id => BOXES.find(b => b.id === id);
const shishById = id => SHISH.find(s => s.id === id);
const saladById = id => SALADS.find(s => s.id === id);
const drinkById = id => DRINKS.find(d => d.id === id);
const nameOf = o => (lang === "ar" ? o.ar : o.en);

const menuEl   = document.getElementById("menu");
const drinksEl = document.getElementById("drinks");

// ---- order helpers ----
function orderCount(){
  return boxLines.length + DRINKS.reduce((s,d) => s + (drinks[d.id]||0), 0);
}
function orderTotal(){
  let sum = 0;
  boxLines.forEach(l => { sum += boxById(l.id).price + l.extras.length * EXTRA_PRICE; });
  DRINKS.forEach(d => { sum += (drinks[d.id]||0) * d.price; });
  return sum;
}
// collapse repeated meat types into "Nx Name" (kept in menu order), localized
function collapseTypes(ids){
  const counts = {};
  ids.forEach(id => counts[id] = (counts[id]||0) + 1);
  return SHISH.filter(s => counts[s.id]).map(s => counts[s.id] + "x " + nameOf(s)).join(T[lang].listSep);
}
// one box line as a single-line summary (used by the cart), localized + collapsed
function boxLineText(line){
  const t = T[lang], b = boxById(line.id);
  let s = nameOf(b);
  if(line.skewers) s += " — " + t.skewersLbl + ": " + collapseTypes(line.skewers);
  s += " — " + t.saladLbl + ": " + nameOf(saladById(line.salad));
  if(line.extras.length) s += " + " + t.extraLbl + ": " + collapseTypes(line.extras);
  return s;
}

// ---- WhatsApp deep link (localized, friendly multi-line; items + choices + qty,
//      plus total, delivery note, thanks). Repeated meat is collapsed to "Nx Name". ----
function waLink(){
  const t = T[lang];
  const D = "   – ";   // detail line: small indent + dash, each choice on its own line
  const boxBlocks = boxLines.map(line => {
    const b = boxById(line.id);
    const rows = ["• " + nameOf(b)];
    if(line.skewers) rows.push(D + t.skewersLbl + ": " + collapseTypes(line.skewers));
    rows.push(D + t.saladLbl + ": " + nameOf(saladById(line.salad)));
    if(line.extras.length) rows.push(D + t.extraLbl + ": " + collapseTypes(line.extras));
    return rows.join("\n");
  });
  const drinkLines = [];
  DRINKS.forEach(d => { const q = drinks[d.id]||0; if(q>0) drinkLines.push("• " + nameOf(d) + " × " + q); });
  const sections = [];
  if(boxBlocks.length)  sections.push(boxBlocks.join("\n\n"));  // blank line between boxes
  if(drinkLines.length) sections.push(drinkLines.join("\n"));
  const msg = t.msgHeader
    + "\n\n" + sections.join("\n\n")
    + "\n\n" + t.totalLbl + ": " + fmt(orderTotal()) + " " + t.each
    + "\n" + t.noDelivery
    + "\n\n" + t.thanks;
  return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
}

// ---- image shimmer helper ----
function imgLoaded(img){
  img.classList.add("loaded");
  const box = img.closest(".imgbox");
  if(box) box.classList.remove("loading");
}

// ---- build the boxes grid (staggered reveal, same as before) ----
let io;
function buildBoxes(instant){
  const t = T[lang], isAr = lang==="ar";
  menuEl.innerHTML = BOXES.map((m,i) => {
    const desc = (isAr?m.dAr:m.dEn) || "";
    const name = nameOf(m);
    const img = m.img
      ? '<img src="'+m.img+'" alt="'+name+'" onload="imgLoaded(this)">'
      : PLACEHOLDER_SVG;
    const boxClass = m.img ? "imgbox loading" : "imgbox";
    return '<article class="card" data-id="'+m.id+'" style="--i:'+i+'">'
      + '<div class="'+boxClass+'">'+img+'</div>'
      + '<div class="cbody">'
        + '<div class="name">'+name+'</div>'
        + (desc ? '<p class="desc">'+desc+'</p>' : '<div style="flex:1"></div>')
        + '<div class="row"><div class="price">'+fmt(m.price)+' '+t.each+'</div>'
          + '<button class="qbtn addbtn choosebtn" onclick="openConfig(\''+m.id+'\')">'+t.choose+'</button></div>'
      + '</div></article>';
  }).join("");

  menuEl.querySelectorAll("img").forEach(img => {
    if(img.complete && img.naturalWidth) imgLoaded(img);
  });

  const cards = [...menuEl.querySelectorAll(".card")];
  if(instant || reduceMotion || !("IntersectionObserver" in window)){
    cards.forEach(c => c.classList.add("in"));
    return;
  }
  if(io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  cards.forEach(c => io.observe(c));
}

// ---- drinks grid (simple +/- steppers) ----
function drinkStepper(d){
  const q = drinks[d.id] || 0;
  return q === 0
    ? '<button class="qbtn addbtn plus" onclick="drinkInc(\''+d.id+'\')">+</button>'
    : '<div class="stepper">'
      + '<button class="qbtn minus" onclick="drinkDec(\''+d.id+'\')">−</button>'
      + '<span class="qty">'+q+'</span>'
      + '<button class="qbtn plus" onclick="drinkInc(\''+d.id+'\')">+</button></div>';
}
function buildDrinks(){
  const t = T[lang];
  drinksEl.innerHTML = DRINKS.map(d =>
    '<article class="card drink in" data-drink="'+d.id+'">'
      + '<div class="cbody">'
        + '<div class="name">'+nameOf(d)+'</div>'
        + '<div class="row"><div class="price">'+fmt(d.price)+' '+t.each+'</div>'
          + '<div class="stepslot" id="d_'+d.id+'">'+drinkStepper(d)+'</div></div>'
      + '</div></article>'
  ).join("");
}
function refreshDrink(id){
  const slot = document.getElementById("d_"+id);
  if(slot) slot.innerHTML = drinkStepper(drinkById(id));
}
function drinkInc(id){ drinks[id] = (drinks[id]||0)+1; refreshDrink(id); updateBar(); }
function drinkDec(id){
  drinks[id] = Math.max(0,(drinks[id]||0)-1);
  if(!drinks[id]) delete drinks[id];
  refreshDrink(id); updateBar();
}

/* ============ configure modal ============ */
function skewerTotal(){ return Object.values(draft.skewers).reduce((s,n)=>s+n,0); }
function extraTotal(){ return Object.values(draft.extras).reduce((s,n)=>s+n,0); }
function draftValid(){
  if(!draft || !draft.salad) return false;
  if(boxById(draft.id).custom && skewerTotal() !== 6) return false;
  return true;
}
function setSalad(sid){ draft.salad = sid; renderConfig(); }
function toggleExtras(){ draft.extrasOpen = !draft.extrasOpen; renderConfig(); }
function extraChange(tid, delta){
  draft.extras[tid] = Math.max(0,(draft.extras[tid]||0)+delta);
  if(!draft.extras[tid]) delete draft.extras[tid];
  renderConfig();
}
function skewerChange(tid, delta){
  if(delta>0 && skewerTotal()>=6) return;
  draft.skewers[tid] = Math.max(0,(draft.skewers[tid]||0)+delta);
  if(!draft.skewers[tid]) delete draft.skewers[tid];
  renderConfig();
}
function stepRow(name, minusFn, plusFn, q, plusDisabled){
  return '<div class="cfg-row"><span class="cfg-name">'+name+'</span>'
    + '<div class="stepper">'
    + '<button class="qbtn minus" onclick="'+minusFn+'"'+(q===0?' disabled':'')+'>−</button>'
    + '<span class="qty">'+q+'</span>'
    + '<button class="qbtn plus" onclick="'+plusFn+'"'+(plusDisabled?' disabled':'')+'>+</button></div></div>';
}
function renderConfig(){
  const t = T[lang], isAr = lang==="ar", b = boxById(draft.id);
  const sheet = document.getElementById("configSheet");
  sheet.dir = isAr ? "rtl" : "ltr";
  let html = '<div class="sheet-head"><div>'
    + '<div class="sheet-title">'+nameOf(b)+'</div>'
    + '<div class="sheet-price">'+fmt(b.price)+' '+t.each+'</div></div>'
    + '<button class="x" onclick="closeConfig()" aria-label="'+t.cancel+'">×</button></div>';
  html += '<div class="sheet-body">';

  // salad (required, every box)
  html += '<div class="field"><div class="field-label">'+t.saladField+'</div><div class="opts">';
  SALADS.forEach(s => {
    html += '<button class="opt'+(draft.salad===s.id?' is-selected':'')+'" onclick="setSalad(\''+s.id+'\')">'+nameOf(s)+'</button>';
  });
  html += '</div></div>';

  // customized: pick exactly 6 skewers
  if(b.custom){
    const total = skewerTotal();
    html += '<div class="field"><div class="field-label">'+t.customField
      + ' <span class="counter'+(total===6?' ok':'')+'">'+total+' '+t.ofSix+'</span></div>';
    SHISH.forEach(s => {
      const q = draft.skewers[s.id]||0;
      html += stepRow(nameOf(s),
        "skewerChange('"+s.id+"',-1)", "skewerChange('"+s.id+"',1)", q, total>=6);
    });
    html += '</div>';
  }

  // addons — collapsed by default (every box)
  const eTotal = extraTotal(), eOpen = !!draft.extrasOpen;
  html += '<div class="field">'
    + '<button class="field-toggle'+(eOpen?' is-open':'')+'" onclick="toggleExtras()"'
    + ' aria-expanded="'+(eOpen?'true':'false')+'">'
    + '<span class="ft-txt">'+t.extraField+'</span>'
    + (eTotal ? '<span class="counter ok">'+eTotal+'</span>' : '')
    + '<span class="chev">▾</span></button>';
  if(eOpen){
    SHISH.forEach(s => {
      const q = draft.extras[s.id]||0;
      html += stepRow(nameOf(s),
        "extraChange('"+s.id+"',-1)", "extraChange('"+s.id+"',1)", q, false);
    });
  }
  html += '</div>';

  html += '</div>'; // sheet-body

  const valid = draftValid();
  let hint = "";
  if(!draft.salad) hint = t.pickSalad;
  else if(b.custom && skewerTotal()!==6) hint = t.pickSix;
  html += '<div class="sheet-foot">'
    + (hint ? '<div class="hint">'+hint+'</div>' : '')
    + '<div class="foot-btns">'
    + '<button class="btn-ghost" onclick="closeConfig()">'+t.cancel+'</button>'
    + '<button class="btn-primary" onclick="addConfiguredBox()"'+(valid?'':' disabled')+'>'+(draft.editUid?t.saveChanges:t.addToCart)+'</button>'
    + '</div></div>';
  sheet.innerHTML = html;
}
function openConfig(id, editUid){
  draft = { id:id, salad:null, extras:{}, skewers:{}, extrasOpen:false, editUid: editUid || null };
  if(editUid){
    const line = boxLines.find(l => l.uid === editUid);
    if(line){
      draft.salad = line.salad;
      line.extras.forEach(t => draft.extras[t] = (draft.extras[t]||0)+1);
      draft.extrasOpen = line.extras.length > 0;   // show existing addons when editing
      if(line.skewers) line.skewers.forEach(t => draft.skewers[t] = (draft.skewers[t]||0)+1);
    }
  }
  renderConfig();
  document.getElementById("configModal").classList.add("show");
  document.body.classList.add("modal-open");
}
function editLine(uid){
  const line = boxLines.find(l => l.uid === uid);
  if(line) openConfig(line.id, uid);
}
function closeConfig(){
  document.getElementById("configModal").classList.remove("show");
  if(!document.getElementById("cartModal").classList.contains("show"))
    document.body.classList.remove("modal-open");
  draft = null;
}
function addConfiguredBox(){
  if(!draftValid()) return;
  const b = boxById(draft.id);
  const extras = [];
  Object.entries(draft.extras).forEach(([tid,n]) => { for(let i=0;i<n;i++) extras.push(tid); });
  let skewers = null;
  if(b.custom){
    skewers = [];
    Object.entries(draft.skewers).forEach(([tid,n]) => { for(let i=0;i<n;i++) skewers.push(tid); });
  }
  const editUid = draft.editUid;
  if(editUid){
    const line = boxLines.find(l => l.uid === editUid);
    if(line){ line.salad = draft.salad; line.extras = extras; line.skewers = skewers; }
  } else {
    boxLines.push({ uid:uidSeq++, id:draft.id, salad:draft.salad, extras, skewers });
  }
  closeConfig();
  updateBar();
  // if the cart is open behind the config modal (edit flow), refresh it in place
  if(document.getElementById("cartModal").classList.contains("show")) renderCart();
}

/* ============ cart modal ============ */
function renderCart(){
  const t = T[lang], isAr = lang==="ar";
  const sheet = document.getElementById("cartSheet");
  sheet.dir = isAr ? "rtl" : "ltr";
  let html = '<div class="sheet-head"><div class="sheet-title">'+t.cartTitle+'</div>'
    + '<button class="x" onclick="closeCart()" aria-label="'+t.cancel+'">×</button></div>';
  html += '<div class="sheet-body">';
  if(orderCount() === 0){
    html += '<p class="empty">'+t.emptyCart+'</p>';
  } else {
    boxLines.forEach(line => {
      html += '<div class="citem"><span class="citem-txt">'+boxLineText(line)+'</span>'
        + '<div class="citem-acts">'
        + '<button class="edit" onclick="editLine('+line.uid+')">'+t.edit+'</button>'
        + '<button class="rm" onclick="removeLine('+line.uid+')" aria-label="'+t.remove+'">×</button>'
        + '</div></div>';
    });
    DRINKS.forEach(d => {
      const q = drinks[d.id]||0;
      if(q>0){
        html += '<div class="citem"><span class="citem-txt">'+nameOf(d)+'</span>'
          + '<div class="stepper sm">'
          + '<button class="qbtn minus" onclick="drinkDec(\''+d.id+'\');renderCart()">−</button>'
          + '<span class="qty">'+q+'</span>'
          + '<button class="qbtn plus" onclick="drinkInc(\''+d.id+'\');renderCart()">+</button></div></div>';
      }
    });
  }
  html += '</div>';
  html += '<div class="sheet-foot"><div class="foot-btns">'
    + '<button class="btn-ghost" onclick="closeCart()">'+t.addMore+'</button>';
  if(orderCount() > 0){
    html += '<a class="btn-primary" href="'+waLink()+'" target="_blank" rel="noreferrer">'
      + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-1.5-.8-2.5-1.4-3.5-3.1-.3-.5.3-.4.8-1.4.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5 4.5 1.9.8 2.6.9 3.5.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 00-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1012 2z"/></svg>'
      + '<span>'+t.order+'</span></a>';
  }
  html += '</div></div>';
  sheet.innerHTML = html;
}
function openCart(){
  renderCart();
  document.getElementById("cartModal").classList.add("show");
  document.body.classList.add("modal-open");
}
function closeCart(){
  document.getElementById("cartModal").classList.remove("show");
  if(!document.getElementById("configModal").classList.contains("show"))
    document.body.classList.remove("modal-open");
}
function removeLine(uid){
  boxLines = boxLines.filter(l => l.uid !== uid);
  renderCart();
  updateBar();
}

// ---- language-dependent text outside the grids ----
function applyText(){
  const t = T[lang], a = ABOUT[lang], isAr = lang==="ar";
  document.body.dir = isAr ? "rtl" : "ltr";
  document.documentElement.lang = lang;

  document.getElementById("brand").textContent = isAr ? "منقل بوكس" : "Man'al Box";
  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("langbtn").textContent = t.langBtn;
  document.getElementById("drinksTitle").textContent = t.drinksTitle;

  document.getElementById("aboutTitle").textContent = a.title;
  document.getElementById("aboutBody").textContent = a.body;
  document.getElementById("hoursLabel").textContent = a.hoursLabel;
  document.getElementById("hoursVal").textContent = a.hours;
  document.getElementById("locLabel").textContent = a.locLabel;
  document.getElementById("locVal").textContent = a.loc;
  document.getElementById("igLink").href = INSTAGRAM;
  document.getElementById("waLink").href = "https://wa.me/" + WHATSAPP_NUMBER;
  document.getElementById("copyright").textContent =
    "© " + new Date().getFullYear() + " Man'al Box · " + t.copyright;
}

function updateBar(){
  const t = T[lang];
  const count = orderCount();
  const bar = document.getElementById("orderbar");
  const countEl = document.getElementById("cartCount");
  if(countEl.textContent !== String(count) && !reduceMotion){
    countEl.classList.remove("bump"); void countEl.offsetWidth; countEl.classList.add("bump");
  }
  countEl.textContent = count;
  document.getElementById("cartWord").textContent = t.items;
  document.getElementById("orderText").textContent = t.order;
  document.getElementById("orderLink").href = waLink();
  bar.dir = document.body.dir;
  if(count > 0){ bar.classList.add("show"); document.body.classList.add("cart-open"); }
  else { bar.classList.remove("show"); document.body.classList.remove("cart-open"); }
}

function toggleLang(){
  lang = lang==="ar" ? "en" : "ar";
  const page = document.querySelector(".page");
  const apply = () => {
    applyText();
    buildBoxes(true);
    buildDrinks();
    updateBar();
    // keep any open modal in sync with the new language
    if(document.getElementById("configModal").classList.contains("show") && draft) renderConfig();
    if(document.getElementById("cartModal").classList.contains("show")) renderCart();
  };
  if(reduceMotion){ apply(); return; }
  page.classList.add("lang-fade");            // smooth EN↔AR crossfade
  setTimeout(() => { apply(); page.classList.remove("lang-fade"); }, 180);
}

// close modals on Escape
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeConfig(); closeCart(); }
});

// ---- initial paint ----
applyText();
buildBoxes(false);
buildDrinks();
updateBar();
</script>
